# Render Blueprint: backend (Docker) + frontend (static site). Fill secrets in the Render dashboard.
services:
  - type: web
    name: memora-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    numInstances: 1   # background memory jobs run in-process; keep one instance
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: memora
      - key: VECTOR_BACKEND
        value: mongodb
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: VOYAGE_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: voyage-3.5
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # e.g. https://memora-web.onrender.com
      - key: ENABLE_DEMO_TOOLS
        value: "true"

  - type: web
    name: memora-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # e.g. https://memora-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
